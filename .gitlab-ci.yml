stages:
  - lint
  - test

image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

variables:
  UV_CACHE_DIR: ".uv-cache"
cache:
  paths:
    - .uv-cache

analysis:
  stage: lint
  script:
    - uv sync
    - uv run ruff check . --fix
    - uv run ruff format --check

unittest:
  stage: test
  script:
    - uv sync
    - uv run pytest tests/test_model.py
