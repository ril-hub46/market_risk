[project]
name = "value-at-risk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.13",
    "numpy>=2.3.5",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "pytest>=9.0.2",
    "python-multipart>=0.0.32",
    "requests>=2.32.5",
    "ruff>=0.14.10",
    "scipy>=1.16.3",
    "streamlit>=1.52.2",
    "uvicorn[standard]>=0.51.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "pkg*", "web*"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
